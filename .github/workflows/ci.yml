name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}

      - name: Check the lockfile matches pyproject.toml
        run: uv lock --check

      # The locked Linux torch pulls about 3 GB of CUDA packages that a CI runner cannot use.
      # Install the CPU build of torch, with every other package pinned to the version in uv.lock.
      - name: Install locked versions (CPU torch)
        run: |
          uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/constraints.txt"
          uv venv
          uv pip install --torch-backend cpu -c "$RUNNER_TEMP/constraints.txt" -e . --group dev

      - name: Lint
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests

      - name: Test
        run: uv run --no-sync pytest -q -rs

  workflow:
    name: Workflow check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      # CLAUDE.md budget, decisions index format, skills and the plans' active list.
      - run: python3 .claude/workflow/check.py

  viewer-and-wheel:
    name: Viewer and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      # Installs and type-checks the viewer, builds it and the wheel, and fails if the wheel lacks it.
      - name: Build
        run: ./scripts/build.sh

      - name: Lint viewer
        working-directory: web
        run: npx oxlint --type-aware src
