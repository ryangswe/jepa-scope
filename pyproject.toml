[project]
name = "jepa-scope"
version = "0.1.0"
description = "See what a JEPA video encoder sees: local latent inspector for V-JEPA 2."
authors = [
    { name = "RDCLder", email = "raymondyang.dev@gmail.com" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
keywords = ["jepa", "v-jepa", "world-models", "visualization", "embeddings"]
dependencies = [
    "av>=18.1.0",
    "fastapi>=0.162.0",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jepa-scope = "jepa_scope.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
